name: PR preview build

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ORIGIN: https://www.haloswitch.com

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: out
          retention-days: 14

      - name: Comment preview instructions
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-preview-artifact -->';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}
            ## Static preview

            This PR built a GitHub Pages-shaped export at domain root (\`/\`). It does **not** publish to the live Pages site.

            - Download the **pages-preview** artifact from [this workflow run](${runUrl}).
            - Unzip and serve it at \`/\` (\`npm run preview\` from the repo after replacing \`out/\`).
            - Intended live URL after Jeff merges and adds the Pages custom domain: https://www.haloswitch.com/
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
